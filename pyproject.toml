[project]
name = "lustre-tools"
version = "1.0.0"
authors = [
  { name="Navya Srivastava", email="navyasrivastava90@gmail.com" },
]
description = "A Utility Library and CLI Tool for the Lustre filesystem"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
  "ClusterShell>=1.8.4",
  "PyYAML>=5.4.1",
]
keywords = ["lustre", "tools"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/Navya1707/lustre-tools"
Repository = "https://github.com/Navya1707/lustre-tools"

[project.scripts]
lustre-tools = "lustre-tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
